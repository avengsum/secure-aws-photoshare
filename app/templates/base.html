<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SecurePhotoshare{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #1e293b; border-bottom: 1px solid #334155; }
        .nav-brand { font-size: 1.2rem; font-weight: 700; color: #38bdf8; text-decoration: none; }
        .nav-links { display: flex; gap: 1rem; align-items: center; }
        .nav-links a, .nav-links button { color: #94a3b8; text-decoration: none; background: none; border: none; cursor: pointer; font-size: 0.9rem; }
        .nav-links a:hover, .nav-links button:hover { color: #e2e8f0; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 2rem; margin-top: 2rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; color: #94a3b8; font-size: 0.9rem; }
        .form-group input[type="text"], .form-group input[type="password"], .form-group input[type="file"] { width: 100%; padding: 0.6rem 0.8rem; background: #0f172a; border: 1px solid #475569; border-radius: 4px; color: #e2e8f0; font-size: 1rem; }
        .form-group input:focus { outline: none; border-color: #38bdf8; }
        .btn { display: inline-block; padding: 0.6rem 1.4rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.95rem; text-decoration: none; }
        .btn:hover { background: #1d4ed8; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }
        .flash { padding: 0.8rem 1rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.9rem; }
        .flash-error { background: #451a2a; border: 1px solid #dc2626; color: #fca5a5; }
        .flash-success { background: #1a3a2a; border: 1px solid #16a34a; color: #86efac; }
        .flash-warning { background: #3a2a1a; border: 1px solid #d97706; color: #fcd34d; }
        h1, h2 { margin-bottom: 1rem; }
        .upload-list { list-style: none; margin-top: 1rem; }
        .upload-list li { padding: 0.6rem 0; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; font-size: 0.9rem; }
        .badge { display: inline-block; padding: 0.2rem 0.5rem; background: #16a34a; border-radius: 3px; font-size: 0.75rem; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="/" class="nav-brand">SecurePhotoshare</a>
        <div class="nav-links">
            {% if session.get('user_id') %}
                <span>{{ session.get('username') }}</span>
                <form method="POST" action="{{ url_for('logout') }}" style="display:inline;">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{{ url_for('login') }}">Login</a>
                <a href="{{ url_for('register') }}">Register</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
