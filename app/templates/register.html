{% extends "base.html" %}
{% block title %}Register - SecurePhotoshare{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <div class="cyber-panel panel-pink">
        <h1 class="glitch-text text-pink">CREATE<br>IDENTITY</h1>
        <div class="subtitle">NEW RECRUITS START HERE</div>

        <div style="margin: 2rem 0; border-top: 1px dashed rgba(255,0,85,0.3); padding-top: 1rem; color: var(--pink); font-size: 0.9rem; letter-spacing: 1px;">
            > REGISTER NEW ACCOUNT /////
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">USERNAME <span>[letters, numbers, underscores]</span></label>
                <input type="text" id="username" name="username" class="cyber-input" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_]+" autocomplete="username" placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label for="password">PASSWORD <span>[min 8 characters]</span></label>
                <input type="password" id="password" name="password" class="cyber-input" required minlength="8" autocomplete="new-password" placeholder="Create a password">
            </div>
            <button type="submit" class="btn btn-pink">REGISTER -></button>
        </form>

        <div style="margin-top: 2rem; text-align: center; position: relative;">
            <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border-color); z-index: 1;"></div>
            <span style="background: var(--panel-bg); padding: 0 1rem; color: var(--text-muted); font-size: 0.85rem; position: relative; z-index: 2;">OR</span>
        </div>
        
        <p style="margin-top: 2rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('login') }}" class="link-muted link-cyan">LOGIN ></a>
        </p>
    </div>
</div>
{% endblock %}
