{% extends "base.html" %}
{% block title %}Register - SecurePhotoshare{% endblock %}
{% block content %}
<div class="card">
    <h2>Create Account</h2>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="username">Username (letters, numbers, underscores)</label>
            <input type="text" id="username" name="username" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_]+" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password (min 8 characters)</label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn">Register</button>
    </form>
    <p style="margin-top: 1rem; font-size: 0.9rem; color: #94a3b8;">
        Already have an account? <a href="{{ url_for('login') }}" style="color: #38bdf8;">Login</a>
    </p>
</div>
{% endblock %}
