name: CI:Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest bandit safety pylint

      - name: Run pylint
        run: pylint app/app.py --disable=C0114,C0115,C0116,R0903 --fail-under=7
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Bandit security scan
        continue-on-error: true
        run: bandit -r app/ -f json -o bandit-report.json --severity-level medium

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Safety dependency check
        shell: bash
        run: |
          set +e
          safety scan --target app --output json > safety-report.json
          safety_status=$?
          if [ "$safety_status" -ne 0 ]; then
            echo "Safety found dependency vulnerabilities or scan errors:"
            cat safety-report.json
          fi
          exit "$safety_status"

      - name: Upload Safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-dependency-report
          path: safety-report.json

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t secure-photoshare:${{ github.sha }} ./app

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-photoshare:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        if: always()

      - name: Block critical or high container vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-photoshare:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  terraform-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tfsec security scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          soft_fail: false

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
        if: always()
