name: CD - Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "terraform/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: secure-photoshare
  TF_VERSION: "1.6.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag image
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "tags=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM Run Command
        run: |
          ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names photoshare-asg \
            --query "AutoScalingGroups[0].Instances[*].InstanceId" \
            --output text)

          for INSTANCE_ID in $INSTANCE_IDS; do
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=[
                'aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY',
                'docker pull ${{ needs.build-and-push.outputs.image_tag }}',
                'docker stop photoshare || true',
                'docker rm photoshare || true',
                'docker run -d --name photoshare --restart unless-stopped -p 8000:8000 --env-file /opt/photoshare/.env ${{ needs.build-and-push.outputs.image_tag }}'
              ]" \
              --timeout-seconds 120
          done

      - name: Wait for healthy targets
        run: |
          TARGET_GROUP_ARN=$(aws elbv2 describe-target-groups \
            --names photoshare-tg \
            --query "TargetGroups[0].TargetGroupArn" \
            --output text 2>/dev/null || echo "")

          if [ -n "$TARGET_GROUP_ARN" ]; then
            echo "Waiting for targets to become healthy..."
            for i in $(seq 1 12); do
              HEALTHY=$(aws elbv2 describe-target-health \
                --target-group-arn "$TARGET_GROUP_ARN" \
                --query "TargetHealthDescriptions[?TargetHealth.State=='healthy'] | length(@)" \
                --output text)
              if [ "$HEALTHY" -ge 1 ]; then
                echo "Deployment healthy: $HEALTHY targets up"
                exit 0
              fi
              sleep 10
            done
            echo "WARNING: No healthy targets after 2 minutes"
            exit 1
          fi
