name: CD:Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "terraform/**"
      - ".github/workflows/cd.yml"

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: secure-photoshare
  TF_VERSION: "1.6.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag image
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          # ECR tags are immutable. The run ID and retry attempt make every
          # build unique while retaining the source commit for traceability.
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
          echo "image_tag=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy via SSM Run Command
        run: |
          ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names photoshare-asg \
            --query "AutoScalingGroups[0].Instances[*].InstanceId" \
            --output text)

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Waiting for SSM Agent to become online on $INSTANCE_ID..."
            ONLINE=""
            for i in $(seq 1 60); do
              ONLINE=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query "InstanceInformationList[0].PingStatus" \
                --output text)
              if [ "$ONLINE" = "Online" ]; then
                break
              fi
              sleep 10
            done

            if [ "$ONLINE" != "Online" ]; then
              echo "ERROR: SSM Agent is not online on $INSTANCE_ID after 10 minutes"
              exit 1
            fi

            BOOTSTRAP_COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["for i in $(seq 1 60); do if [ -s /opt/photoshare/.env ] && [ -f /opt/photoshare/bootstrap-ready ] && systemctl is-active --quiet nginx; then exit 0; fi; sleep 5; done; echo Bootstrap did not become ready >&2; exit 1"]' \
              --timeout-seconds 360 \
              --query "Command.CommandId" \
              --output text)

            echo "Waiting for application bootstrap on $INSTANCE_ID ($BOOTSTRAP_COMMAND_ID)..."
            BOOTSTRAP_STATUS="Pending"
            for i in $(seq 1 60); do
              BOOTSTRAP_STATUS=$(aws ssm get-command-invocation \
                --command-id "$BOOTSTRAP_COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || echo "Pending")
              case "$BOOTSTRAP_STATUS" in
                Success)
                  break
                  ;;
                Failed|Cancelled|TimedOut|Cancelling)
                  aws ssm get-command-invocation \
                    --command-id "$BOOTSTRAP_COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --output json
                  exit 1
                  ;;
              esac
              sleep 5
            done

            if [ "$BOOTSTRAP_STATUS" != "Success" ]; then
              echo "ERROR: Application bootstrap did not complete on $INSTANCE_ID after 5 minutes"
              aws ssm get-command-invocation \
                --command-id "$BOOTSTRAP_COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --output json
              exit 1
            fi
          done

          for INSTANCE_ID in $INSTANCE_IDS; do
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=[
                'aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY',
                'docker pull ${{ needs.build-and-push.outputs.image_tag }}',
                'docker run --rm --env-file /opt/photoshare/.env --read-only --tmpfs /tmp -e PYTHONDONTWRITEBYTECODE=1 ${{ needs.build-and-push.outputs.image_tag }} python /app/migrate.py',
                'docker stop photoshare || true',
                'docker rm photoshare || true',
                'docker run -d --name photoshare --restart unless-stopped -p 8000:8000 --env-file /opt/photoshare/.env ${{ needs.build-and-push.outputs.image_tag }}'
              ]" \
              --timeout-seconds 120 \
              --query "Command.CommandId" \
              --output text)

            echo "Waiting for SSM deployment on $INSTANCE_ID ($COMMAND_ID)..."
            if ! aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --output json
              exit 1
            fi
          done

      - name: Wait for healthy targets
        run: |
          TARGET_GROUP_ARN=$(aws elbv2 describe-target-groups \
            --names photoshare-tg \
            --query "TargetGroups[0].TargetGroupArn" \
            --output text 2>/dev/null || echo "")

          if [ -n "$TARGET_GROUP_ARN" ]; then
            echo "Waiting for targets to become healthy..."
            for i in $(seq 1 30); do
              HEALTHY=$(aws elbv2 describe-target-health \
                --target-group-arn "$TARGET_GROUP_ARN" \
                --query "TargetHealthDescriptions[?TargetHealth.State=='healthy'] | length(@)" \
                --output text)
              if [ "$HEALTHY" -ge 1 ]; then
                echo "Deployment healthy: $HEALTHY targets up"
                exit 0
              fi
              sleep 10
            done
            echo "ERROR: No healthy targets after 5 minutes"
            exit 1
          else
            echo "ERROR: Target group photoshare-tg was not found"
            exit 1
          fi
